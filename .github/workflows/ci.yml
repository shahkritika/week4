name: Microservices Continuous Integration (CI) Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-lint:
    name: Run Linting & Unit/API Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pyjwt pytest httpx flake8 coverage

      - name: Code Quality & Linting Check (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run 8 Automated Microservices Tests
        env:
          JWT_SECRET: super-secret-key-week4-ci-pipeline
          AUTH_DB_PATH: ci_auth.db
          INVENTORY_DB_PATH: ci_inventory.db
        run: |
          python Day21_Testing_and_Docker/run_tests.py

      - name: Run Pytest with Coverage
        run: |
          python -m coverage run -m unittest discover -s Day21_Testing_and_Docker/tests -p "test_*.py"
          python -m coverage report -m

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-coverage-python-${{ matrix.python-version }}
          path: .coverage

